<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Lesieur</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/script.js" defer></script>
    
</head>
<body>

    <!----HEADER---->

    <header>
        <div class="wrapper">

            <a  class="logo" href="index.html">
                <img src="Images/logo.png" alt="logo voyage lesieur">Voyage LeSIEUR
            </a>

            <nav class="nav">
                <ul class="menu">
                    <li><a href="#">Magasiner</a></li>
                    <li><a href="#">Support</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!----HERO---->

    <section class="hero">
        <div class="wrapper">
            <h1>Trouver tout pour le voyage!</h1>
        </div>
    </section>

    <!----CONTENU---->
    
    <section class="transports">
        <div class="wrapper">

            <div class="titre-section">
                <h2>Transports</h2>
                <img src="Images/plus.svg" class="js-plus" alt="Bouton plus">
            </div>


            <div class="conteneur-transports">
                <article class="transport">
                    <img src="Images/avion.jpg" alt="forfait avion">

                    <h3>Forfaits <strong>avion</strong></h3>

                    <p>Voyager rapidement et confortablement</p>
                </article>

                <article class="transport">
                    <img src="Images/bateau.png" alt="forfait avion">

                    <h3>Forfaits <strong>croisière</strong></h3>

                    <p>Laissez-vous porter par les vagues</p>
                </article>

                <article class="transport">
                    <img src="Images/auto.png" alt="forfait avion">

                    <h3>Forfaits <strong>voiture</strong></h3>

                    <p>Voitures de luxe pour plus de confort</p>
                </article>

            </div>

        </div>
    </section>

    <!----FOOTER---->

            <footer class="footer">
                <div class="wrapper">

                    <p>Voyage LeSieur</p>

                    <nav>
                        <ul class="menu-social">
                            <li class="facebook"><a  href="#"><img src="Images/social-facebook.svg" alt="facebook"></a></li>
                            <li class="twitter"><a href="#"><img src="Images/social-twitter.svg" alt="twitter"></a></li>
                            <li class="linkedin"><a href="#"><img src="Images/social-linkedin.svg" alt="linkedin"></a></li>
                        </ul>
                    </nav>

                </div>
            </footer>

    
</body>
</html>
